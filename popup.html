<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 180px;
        padding: 12px;
        font-family: system-ui, sans-serif;
        background: #1e1e1e;
        color: #e0e0e0;
        margin: 0;
      }
      .container {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      label {
        font-size: 14px;
        font-weight: 500;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <label for="toggle">Enable Custom Font</label>
      <input type="checkbox" id="toggle" />
    </div>
    <script src="popup.js"></script>
  </body>
</html>
